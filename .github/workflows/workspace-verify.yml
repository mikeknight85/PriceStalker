name: Verify Workspace

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build all workspaces
        run: pnpm run build:all

      - name: Run backend tests
        run: pnpm --filter pricestalker-backend exec vitest run

      - name: Run frontend unit tests
        run: pnpm --filter pricestalker-frontend test

      - name: Install Playwright Chromium
        run: pnpm --filter pricestalker-frontend exec playwright install --with-deps chromium

      - name: Run frontend route acceptance tests
        run: pnpm --filter pricestalker-frontend run test:routes

  # The telemetry collector is a Cloudflare Worker and is deliberately NOT a pnpm
  # workspace package: it has its own toolchain (wrangler) that the application
  # workspaces do not need. It still has to be typechecked — it was previously
  # the only code in the repository that CI never compiled.
  telemetry-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install collector dependencies
        working-directory: telemetry-collector
        run: npm install --no-audit --no-fund

      - name: Typecheck collector
        working-directory: telemetry-collector
        run: npm run typecheck
