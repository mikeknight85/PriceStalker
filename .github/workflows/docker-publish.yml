name: Publish Docker Images

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scraper/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

# `beta` is a moving tag: whichever run pushes last owns it. Without this, two
# overlapping pushes to main race, and the *older* commit can win.
#
# That is not hypothetical. On 2026-09-05 a merge and the release commit that
# followed it were building at the same time:
#
#   release commit (2.1.0-beta.7)  publish-frontend  09:21:22 -> 09:22:35
#   the merge before it (beta.6)   publish-frontend  09:21:53 -> 09:23:05
#
# The older build finished thirty seconds later and left `beta` pointing at it,
# so production deployed a frontend one version behind its own backend.
#
# Grouping per ref serialises main against itself and cancels the superseded
# run: a build for a commit that is no longer the tip has nothing useful to
# publish. Tags each get their own group and are never cancelled -- those
# publish immutable version tags, and every one of them has to exist.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/workspace-verify.yml
    permissions:
      contents: read

  changes:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scraper: ${{ steps.filter.outputs.scraper }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-image.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-image.yml'
            scraper:
              - 'scraper/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-image.yml'

  publish-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository_owner }}/pricestalker-backend
      dockerfile: ./backend/Dockerfile
      cache-scope: backend
      publish: true
      channel: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'beta' }}

  publish-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository_owner }}/pricestalker-frontend
      dockerfile: ./frontend/Dockerfile
      cache-scope: frontend
      publish: true
      channel: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'beta' }}

  publish-scraper:
    needs: changes
    if: needs.changes.outputs.scraper == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository_owner }}/pricestalker-scraper
      dockerfile: ./scraper/Dockerfile
      cache-scope: scraper
      publish: true
      channel: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'beta' }}
